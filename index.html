<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolic Maze - Physics Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="top-section">
            <div id="food-inventory" class="inventory-panel">
                <h3>Food Items</h3>
                <div id="food-items-container"></div>
            </div>
            
            <div id="playground"></div>
        </div>
        
        <div id="station-inventory" class="inventory-panel">
            <h3>Station Inventory - Drag to Playground</h3>
            <div class="station-items"> 
                <div class="station-template" draggable="true" data-station="station1">
                    <h4>Station 1: Mouth</h4>
                    <p>Herbivorous Only</p>
                </div>
                <div class="station-template" draggable="true" data-station="station2">
                    <h4>Station 2: Stomach</h4>
                    <p>Solubility Sort</p>
                </div>
                    <div class="station-template" draggable="true" data-station="station3">
                    <h4>Station 3:asdfnajsdf</h4>
                    <p>Solubility Sort</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
